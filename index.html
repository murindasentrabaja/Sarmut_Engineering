<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sasaran Mutu Engineering</title>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#26324a;--mut:#6b7a93;--ok:#2fa874;--bad:#e8605d;--wait:#d98b2b;--blue:#5b8def;--line:rgba(120,140,180,.22)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font:14px/1.5 Figtree,system-ui,sans-serif;color:var(--ink);background:radial-gradient(55% 45% at 8% 0,#cfe2ff,transparent 70%),radial-gradient(45% 40% at 96% 8%,#e8dcff,transparent 70%),radial-gradient(55% 50% at 50% 100%,#d3f4e5,transparent 70%),#f4f7fc;background-attachment:fixed}
.gl{background:rgba(255,255,255,.55);-webkit-backdrop-filter:blur(22px) saturate(170%);backdrop-filter:blur(22px) saturate(170%);border:1px solid rgba(255,255,255,.8);border-radius:22px;box-shadow:0 10px 34px rgba(80,110,170,.13),inset 0 1px 0 rgba(255,255,255,.95)}
.i{width:20px;height:20px;flex:none}.lg{width:32px;height:32px}
.bar{position:sticky;top:10px;z-index:5;width:calc(100% - 24px);max-width:1100px;margin:10px auto 0;display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 18px}
.bar h1{font-size:16px;margin:0;font-weight:700;flex:1;min-width:190px;display:flex;align-items:center;gap:10px}
.bar select,.bar button{font:inherit;display:inline-flex;align-items:center;gap:6px;border-radius:12px;border:1px solid rgba(255,255,255,.9);background:rgba(255,255,255,.65);color:var(--ink);padding:6px 12px;cursor:pointer}
.bar .go{background:linear-gradient(135deg,#8fb4ff,#a99bf5);color:#fff;font-weight:600;border:0}
.live{font-size:12px;color:var(--mut);display:flex;align-items:center;gap:6px}
.live:before{content:"";width:8px;height:8px;border-radius:50%;background:#4fd49a;animation:p 2s infinite}
.live.off:before{background:#ff8a80;animation:none}
@keyframes p{50%{opacity:.35}}
.wrap{max-width:1100px;margin:0 auto;padding:20px 12px}
.hero{display:grid;grid-template-columns:minmax(220px,300px) 1fr;gap:28px;padding:26px}
.big span{font-size:60px;font-weight:700;letter-spacing:-2px;line-height:1;color:var(--blue)}
.big p{margin:10px 0 0}.sub{color:var(--mut);font-size:13px}
.bars{display:flex;gap:6px;height:190px;position:relative}
.tl{position:absolute;left:0;right:0;top:0;border-top:1px dashed var(--mut)}
.tl em{position:absolute;right:0;top:-18px;font-size:11px;color:var(--mut);font-style:normal}
.b{flex:1;display:flex;flex-direction:column;height:100%;background:none;border:0;padding:0;font:inherit;font-size:11px;color:var(--mut);cursor:pointer}
.col{flex:1;width:100%;display:flex;align-items:flex-end}
.col i{display:block;width:100%;min-height:3px;border-radius:8px 8px 0 0;background:linear-gradient(#f4a09e,var(--bad))}
.col i.ok{background:linear-gradient(#8fe0bb,var(--ok))}.col i.na{background:var(--line)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-top:14px}
.tile{display:flex;align-items:center;gap:14px;padding:16px 18px}
.tile b{display:block;font-size:24px;line-height:1.1}.tile span{color:var(--mut);font-size:12px}
h2{font-size:15px;margin:26px 4px 10px;display:flex;align-items:center;gap:8px}
.sc{overflow-x:auto}
.t{width:100%;border-collapse:collapse;white-space:nowrap}
.t th,.t td{padding:10px 12px;text-align:right;border-bottom:1px solid var(--line)}
.t th{font-size:12px;color:var(--mut);font-weight:600}
.t th:first-child,.t td:first-child{text-align:left}
.t tr:last-child td{border-bottom:0}.t tfoot td{font-weight:700;background:rgba(255,255,255,.4)}
.chip{padding:2px 10px;border-radius:99px;font-size:12px;font-weight:600;background:rgba(120,140,180,.14);color:var(--mut)}
.chip.ok{background:rgba(47,168,116,.15);color:var(--ok)}.chip.bad{background:rgba(232,96,93,.15);color:var(--bad)}.chip.wait{background:rgba(240,160,67,.18);color:var(--wait)}
.act button{font:inherit;font-size:12px;border:1px solid rgba(255,255,255,.9);background:rgba(255,255,255,.7);border-radius:10px;padding:3px 10px;margin-left:4px;cursor:pointer}
.err{padding:30px;text-align:center;color:var(--bad)}.warn{margin:12px 4px 0;color:var(--wait);font-size:13px}
#rpt,#dash{display:none}
[data-v=dash] #dash{display:block}[data-v=rpt] #rpt{display:block}
#rpt{overflow-x:auto;padding:0 12px 20px}
.pg{background:#fff;color:#000;width:297mm;margin:16px auto;padding:10mm;border-radius:6px;box-shadow:0 8px 30px rgba(80,110,170,.18);font:12px/1.4 Arial,Helvetica,sans-serif}
.pg table{width:100%;border-collapse:collapse}
.pg td,.pg th{border:1px solid #000;padding:5px 7px;vertical-align:top;text-align:left;overflow-wrap:anywhere}
.pg .lgo{width:190px;text-align:center;vertical-align:middle}.pg .lgo img{width:165px;height:auto;display:block;margin:0 auto}
.bar h1 img{height:30px;width:auto}
.pg th{text-align:center;background:#eee}
.pg .ttl{text-align:center;font-weight:700;font-size:16px;vertical-align:middle}
.pg .meta{margin:10px 0}.pg .meta td,.pg .sig td,.pg .nt td{border:0;padding:1px 4px}
.pg .sig{margin-top:14px;text-align:center}.pg .sig td{text-align:center;width:50%}
.pg .sig b{display:block;margin-top:62px;text-decoration:underline}
.pg .c{text-align:center}.pg h3{text-align:center;margin:0 0 4px;font-size:14px}
.frac{display:inline-block;text-align:center;vertical-align:middle;margin:0 4px}
.frac i{display:block;font-style:normal;padding:0 8px}.frac i:first-child{border-bottom:1px solid #000}
.pg .lt td{font-size:11px;padding:3px 5px}.pg thead{display:table-header-group}.pg tr{break-inside:avoid}
.pg .ft{margin-top:8px;font-size:10px;color:#444;text-align:right}
@media(max-width:760px){.hero{grid-template-columns:1fr}}
@media print{
@page{size:A4 landscape;margin:10mm}
body{background:#fff}.noprint{display:none!important}
#rpt{overflow:visible;padding:0}
.pg{box-shadow:none;border-radius:0;margin:0;padding:0;width:100%;break-after:page}.pg:last-child{break-after:auto}}
</style></head>

 tgt:`<svg class="i lg" viewBox="0 0 24 24"><path d="M2 6.5A1.5 1.5 0 0 1 3.500 5h9A1.500 1.500 0 0 1 14 6.500V16H2z" fill="#8fb4ff"/><path d="M14 9h4l3 3.500V16h-7z" fill="#a99bf5"/><circle cx="7" cy="17.500" r="2.200" fill="#5b8def"/><circle cx="17.500" cy="17.500" r="2.200" fill="#5b8def"/></svg>`,
 ok:`<svg class="i lg" viewBox="0 0 24 24" fill="none"><path d="M3.500 12.500l5.500 5.500L20.500 6" stroke="#2fa874" stroke-width="3.200" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
 late:`<svg class="i lg" viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9" stroke="#ef8a6b" stroke-width="2.600"/><path d="M12 7v5.500l3.500 2" stroke="#e8605d" stroke-width="2.600"/></svg>`,
 ncr:`<svg class="i lg" viewBox="0 0 24 24"><path d="M5 3.500A1.500 1.500 0 0 1 6.500 2H14l5 5v13.500a1.500 1.500 0 0 1-1.500 1.500h-11A1.500 1.500 0 0 1 5 20.500z" fill="#cdbcff"/><path d="M14 2l5 5h-3.500A1.500 1.500 0 0 1 14 5.500z" fill="#a98cf2"/><path d="M8.500 13h7M8.500 17h4.500" stroke="#7a5be0" stroke-width="2.200" stroke-linecap="round"/></svg>`,
 print:S('#5b8def','<path d="M7 9V3h10v6"/><path d="M7 17H4V9h16v8h-3" stroke="#a99bf5"/><path d="M7 14h10v7H7z" stroke="#5b8def"/>'),
 back:S('#d98b2b','<path d="M15 5l-7 7 7 7"/>')};

let D=null,V='dash',P=null,ver='';
document.getElementById('lg').src=LOGO;
const $=s=>document.querySelector(s),pad=n=>('0'+n).slice(-2);
const n1=x=>(Math.round(x*1000)/10).toLocaleString('id-ID')+'%';
const dmy=s=>s?s.slice(8,10)+'/'+s.slice(5,7)+'/'+s.slice(0,4):'-';
const tgl=s=>+s.slice(8,10)+' '+BL[+s.slice(5,7)-1]+' '+s.slice(0,4);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const call=(a,p)=>/XXXX/.test(API_URL)?Promise.reject('NOAPI'):
 fetch(API_URL+'?'+new URLSearchParams({action:a,...(p||{})})).then(r=>r.json()).then(d=>{if(d.error)throw d.error;return d});
const pubDate=(y,m)=>(m>11?y+1:y)+'-'+pad(m>11?1:m+1)+'-'+pad(CFG.DAY);
const stat=m=>m.jt?(m.pct>=D.target?'Tercapai':'Belum Tercapai'):'-';
function phase(y,m){const k=y+'-'+pad(m),t=D.today;
 if(k>t.slice(0,7))return['Mendatang',''];if(k===t.slice(0,7))return['Berjalan',''];
 return t>=pubDate(y,m)?['Terbit','ok']:['Draft, terbit '+tgl(pubDate(y,m)).slice(0,-5),'wait'];}


async function load(y=D&&D.year||''){
 try{D=await call('data',{year:y});ver=D.v;
  $('#sync').textContent='Tersinkron '+new Date().toLocaleTimeString('id-ID');$('#sync').className='live';render();}
 catch(e){$('#sync').textContent='Gagal memuat data';$('#sync').className='live off';
  if(!D)$('#dash').innerHTML='<div class="err gl">'+(e==='NOAPI'?'URL web app belum diisi. Tempel hasil Deploy Code.gs pada API_URL di index.html.':'Data tidak dapat dimuat. Pastikan Code.gs sudah di-deploy dengan akses "Siapa saja" dan URL pada API_URL benar.')+'</div>';}}
setInterval(async()=>{if(document.hidden||!D)return;try{const r=await call('version');if(r.v!==ver)load();}catch(e){}},15000);
async function openReport(key,print){const y=+key.slice(0,4);if(y!==D.year)await load(y);
 V='rpt';P=key;render();scrollTo(0,0);if(print)setTimeout(()=>window.print(),300);}
function render(){
 document.body.dataset.v=V;
 const yrs=[...new Set([...D.years,D.year,+D.today.slice(0,4)])].sort();
 $('#yr').innerHTML=yrs.map(y=>`<option ${y==D.year?'selected':''}>${y}</option>`).join('');
 $('#rt').style.display=$('#bk').style.display=V==='rpt'?'':'none';
 $('#pr').innerHTML=I.print.replace('stroke="#5b8def"','stroke="#fff"')+'Cetak laporan + lampiran';$('#bk').innerHTML=I.back+'Dashboard';
 if(V==='rpt'){const m=+P.slice(5,7);
  $('#pm').innerHTML=BL.map((b,i)=>`<option value="${i+1}" ${i+1===m?'selected':''}>${b} ${D.year}</option>`).join('');
  $('#rpt').innerHTML=rep(D.year,m);}
 else $('#dash').innerHTML=dash();}
function dash(){
 const y=D.ytd,ms=D.months,N=D.ncr,nt=N.months.reduce((a,m)=>a+m.total,0);
 const bars=ms.map(m=>{const c=m.pct==null?'na':m.pct>=D.target?'ok':'';
  return`<button class="b" data-o="${m.m}" title="${m.bulan}: ${m.pct==null?'belum ada unit jatuh tempo':n1(m.pct)}"><span class="col"><i class="${c}" style="height:${m.pct==null?2:Math.max(m.pct*100,2)}%"></i></span>${m.bulan.slice(0,3)}</button>`}).join('');
 const rows=ms.map(m=>{const f=phase(D.year,m.m),n=N.months[m.m-1];
  return`<tr><td>${m.bulan}</td><td>${m.po}</td><td>${m.total}</td><td>${m.jt}</td><td>${m.tepat}</td><td>${m.telat}</td><td>${m.belum}</td><td>${m.belumJT}</td><td><b>${m.pct==null?'-':n1(m.pct)}</b></td><td><span class="chip ${m.jt?(m.pct>=D.target?'ok':'bad'):''}">${stat(m)}</span></td><td>${n.total}</td><td><span class="chip ${n.total?(n.over.length?'bad':'ok'):''}">${n.total?(n.over.length?'Belum Tercapai':'Tercapai'):'Nihil'}</span></td><td><span class="chip ${f[1]}">${f[0]}</span></td><td class="act">${m.total||n.total?`<button data-o="${m.m}">Buka</button><button data-o="${m.m}" data-p="1">Cetak</button>`:''}</td></tr>`}).join('');
 const cl=Object.entries(y.k).sort().map(([c,v])=>`<tr><td>${esc(c)}</td><td>${v.jt}</td><td>${v.tepat}</td><td><b>${v.jt?n1(v.tepat/v.jt):'-'}</b></td></tr>`).join('');
 const tile=(ic,v,l)=>`<div class="gl tile">${ic}<div><b>${v}</b><span>${l}</span></div></div>`;
 return`<section class="gl hero"><div class="big"><span>${y.pct==null?'-':n1(y.pct)}</span>
 <p>Ketepatan pengiriman unit ${D.year}<br><b>${y.tepat}</b> dari <b>${y.jt}</b> unit jatuh tempo terkirim tepat waktu</p>
 <p class="sub">Data per ${tgl(D.today)}.</p></div>
 <div class="bars"><div class="tl"><em>Target ${n1(D.target)}</em></div>${bars}</div></section>
 <div class="tiles">${tile(I.ok,y.tepat,'Unit tepat waktu')}${tile(I.late,y.telat+y.belum,'Terlambat / belum terkirim')}${tile(I.tgt,y.belumJT,'Belum jatuh tempo')}${tile(I.ncr,nt,'NCR gambar dari QC')}</div>
 ${N.warn?`<p class="warn">Sheet NCR: ${esc(N.warn)}</p>`:''}
 <h2>${I.tgt.replace('lg','')}Pencapaian per bulan</h2><div class="gl sc"><table class="t"><thead><tr><th>Bulan</th><th>PO</th><th>Total unit</th><th>Jatuh tempo</th><th>Tepat waktu</th><th>Terlambat</th><th>Belum kirim</th><th>Belum JT</th><th>% Kirim</th><th>Status</th><th>NCR gambar</th><th>Status NCR</th><th>Laporan</th><th></th></tr></thead><tbody>${rows}</tbody>
 <tfoot><tr><td>Total ${D.year}</td><td>${y.po}</td><td>${y.total}</td><td>${y.jt}</td><td>${y.tepat}</td><td>${y.telat}</td><td>${y.belum}</td><td>${y.belumJT}</td><td>${y.pct==null?'-':n1(y.pct)}</td><td></td><td>${nt}</td><td></td><td></td><td></td></tr></tfoot></table></div>
 <h2>${I.ok.replace('lg','')}Pencapaian per client (${D.year})</h2><div class="gl sc"><table class="t"><thead><tr><th>Client</th><th>Jatuh tempo</th><th>Tepat waktu</th><th>% Kirim</th></tr></thead><tbody>${cl||'<tr><td colspan="4">Belum ada data</td></tr>'}</tbody></table></div>
 <p class="sub" style="margin:14px 4px">Laporan dibuat otomatis oleh sistem setiap tanggal ${CFG.DAY} untuk bulan sebelumnya; sebelum tanggal itu laporan berstatus draft dan angkanya mengikuti data terbaru. NCR yang dihitung hanya yang berkategori masalah gambar (maks. ${N.max} kejadian per bulan per proyek).</p>`;}
function rep(y,m){
 const mo=D.months[m-1],nm=D.ncr.months[m-1],key=y+'-'+pad(m),pf=pubDate(y,m),per=BL[m-1]+' '+y,noRep='SM-ENG-'+y+pad(m);
 const L=D.lines.filter(r=>String(r[5]).slice(0,7)===key),NL=D.ncr.lines.filter(r=>r.tgl.slice(0,7)===key),ok=mo.jt&&mo.pct>=D.target;
 const real=mo.jt?`% pengiriman unit =<span class="frac"><i>${mo.tepat}</i><i>${mo.jt}</i></span>= <b>${n1(mo.pct)}</b>`:'-';
 const ket=!mo.jt?'Tidak ada unit jatuh tempo pada periode ini':ok?'Lihat Lampiran':`Belum tercapai: ${mo.telat} unit terlambat, ${mo.belum} unit belum terkirim. Lihat Lampiran`;
 const real2=nm.total?`<b>${nm.total}</b> kejadian<br>(maks. ${nm.max} per proyek)`:'<b>0</b> kejadian';
 const ket2=!nm.total?CFG.K2:nm.over.length?`Belum tercapai: ${nm.over.map(esc).join(', ')} melebihi ${D.ncr.max} kejadian. Lihat Lampiran`:'Tercapai. Lihat Lampiran';
 const lh=`<table style="margin-bottom:10px"><tr><td class="lgo" rowspan="2"><img src="${LOGO}" alt="PT Murinda Sentra Baja"></td><td class="ttl" rowspan="2">LAMPIRAN LAPORAN PENCAPAIAN SASARAN MUTU</td><td>No. Report</td><td>${noRep}</td></tr><tr><td>Periode</td><td>${per}</td></tr></table>`;
 const sg=(h,a)=>`<td>${h}<b>${a[0]}</b>${a[1]}</td>`;
 const cs=Object.entries(mo.k).sort().map(([c,v])=>`<tr><td>${esc(c)}</td><td class="c">${v.jt}</td><td class="c">${v.tepat}</td><td class="c">${v.jt?n1(v.tepat/v.jt):'-'}</td></tr>`).join('');
 const ln=L.map((r,i)=>`<tr><td class="c">${i+1}</td><td>${esc(r[1])}</td><td>${esc(r[2])}</td><td>${esc(r[3])}</td><td>${esc(r[4])}</td><td class="c">${dmy(r[5])}</td><td class="c">${dmy(r[6])}</td><td>${esc(r[7])}</td><td>${esc(r[8])}</td></tr>`).join('');
 const nl=NL.map((r,i)=>`<tr><td class="c">${i+1}</td><td>${esc(r.ncr)}</td><td class="c">${dmy(r.tgl)}</td><td>${esc(r.pro)}</td><td>${esc([r.unit,r.part].filter(Boolean).join(' / '))}</td><td>${esc(r.ur||r.kat)}</td><td>${esc(r.st)}</td></tr>`).join('');
 return`<article class="pg"><table><tr><td class="lgo" rowspan="2"><img src="${LOGO}" alt="PT Murinda Sentra Baja"></td><td class="ttl" rowspan="2">LAPORAN PENCAPAIAN SASARAN MUTU</td><td>No. Form</td><td>${CFG.FORM}</td></tr><tr><td>Revisi</td><td>${CFG.REV}</td></tr></table>
 <table class="meta"><tr><td width="150">Departemen/Proyek*</td><td width="10">:</td><td>${CFG.DEPT}</td><td width="110">Tanggal Pengisian</td><td width="10">:</td><td width="120">${tgl(pf)}</td></tr><tr><td>Periode Laporan</td><td>:</td><td colspan="4">${per}</td></tr></table>
 <table><thead><tr><th width="30">No.</th><th width="25%">Sasaran</th><th>Target</th><th width="26%">Realisasi</th><th width="24%">Keterangan **)</th></tr></thead><tbody>
 <tr><td class="c" rowspan="2">1</td><td rowspan="2">Ketaatan pelaksanaan prosedur perusahaan</td><td>a. Untuk audit internal tidak ada temuan audit atau NC yang berulang dari audit sebelumnya</td><td class="c">-</td><td>${CFG.K1}</td></tr>
 <tr><td>b. Untuk audit eksternal ISO 9001 tidak ada minor NC</td><td class="c">-</td><td>${CFG.K1}</td></tr>
 <tr><td class="c">2</td><td>Ketepatan pengecekan gambar</td><td>Jumlah ketidaksesuaian gambar kerja yang ditemukan oleh Quality Control maksimal ${D.ncr.max} kejadian per bulan per proyek</td><td class="c">${real2}</td><td>${ket2}</td></tr>
 <tr><td class="c">3</td><td>Ketepatan pengiriman unit</td><td>${n1(D.target)} pengiriman unit per bulan per P.O</td><td class="c">${real}</td><td>${ket}</td></tr></tbody></table>
 <table class="sig"><tr>${sg('Dibuat Oleh,',CFG.DIBUAT)}${sg('Disetujui Oleh,',CFG.SETUJU)}</tr></table>
 <table class="nt" style="margin-top:18px"><tr><td colspan="3"><b>Keterangan:</b></td></tr><tr><td width="24">*)</td><td width="10">:</td><td>Coret yang tidak perlu</td></tr><tr><td>**)</td><td>:</td><td>Kolom keterangan diisi apabila ada keterangan, tambahan, atau apabila item sasaran mutu tidak tercapai</td></tr></table>
 <p class="ft">${foot()}</p></article>
 <article class="pg">${lh}
 <p class="c" style="margin:0 0 10px">Sasaran 3: Ketepatan pengiriman unit, periode ${per}</p>
 <table class="lt"><thead><tr><th>Ringkasan</th><th>PO unik</th><th>Total unit</th><th>Jatuh tempo</th><th>Tepat waktu</th><th>Terlambat</th><th>Belum terkirim</th><th>Belum JT</th></tr></thead><tbody><tr><td>${per}</td><td class="c">${mo.po}</td><td class="c">${mo.total}</td><td class="c">${mo.jt}</td><td class="c">${mo.tepat}</td><td class="c">${mo.telat}</td><td class="c">${mo.belum}</td><td class="c">${mo.belumJT}</td></tr></tbody></table>
 <table class="lt" style="margin-top:8px"><thead><tr><th>Client</th><th width="80">Jatuh tempo</th><th width="80">Tepat waktu</th><th width="80">% Kirim</th></tr></thead><tbody>${cs||'<tr><td colspan="4" class="c">-</td></tr>'}</tbody></table>
 <table class="lt" style="margin-top:12px"><thead><tr><th>No</th><th>PO Number</th><th>Client</th><th>Unit Number</th><th>Part Number</th><th>Target Delivery</th><th>Tgl Kirim Aktual</th><th>Status Pengiriman</th><th>Keterangan</th></tr></thead><tbody>${ln||'<tr><td colspan="9" class="c">Tidak ada data pengiriman pada periode ini</td></tr>'}</tbody></table>
 <p class="ft">${foot()}</p></article>
 <article class="pg">${lh}
 <p class="c" style="margin:0 0 10px">Sasaran 2: Ketidaksesuaian gambar kerja (NCR dari Quality Control), periode ${per}</p>
 <table class="lt"><thead><tr><th>No</th><th>No. NCR</th><th>Tanggal</th><th>Proyek</th><th>Unit / Part</th><th>Uraian Masalah Gambar</th><th>Status</th></tr></thead><tbody>${nl||'<tr><td colspan="7" class="c">Tidak ada NCR masalah gambar pada periode ini</td></tr>'}</tbody></table>
 <p class="ft">${foot()}</p></article>`;}
const foot=()=>`Dicetak melalui sistem ERP Engineering | Sasaran Mutu ${CFG.DEPT} · ${new Date().toLocaleString('id-ID')}`;
document.addEventListener('click',e=>{
 const b=e.target.closest('[data-o]');if(b&&D)return openReport(D.year+'-'+pad(b.dataset.o),!!b.dataset.p);
 if(e.target.closest('#bk')){V='dash';render();}
 if(e.target.closest('#pr'))window.print();});
document.addEventListener('change',e=>{
 if(e.target.id==='yr')load(+e.target.value).then(()=>{if(V==='rpt')openReport(D.year+'-'+P.slice(5,7));});
 if(e.target.id==='pm')openReport(D.year+'-'+pad(e.target.value));});
(async()=>{await load('');const m=/laporan\/(\d{4}-\d{2})/.exec(location.hash||'');if(m&&D)openReport(m[1]);})();
</script></body></html>
